name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'Intelligent Tracker'
          curl -fsS http://localhost:8080/some/spa/route | grep -q 'Intelligent Tracker'
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
