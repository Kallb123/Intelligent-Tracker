name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (recurrence engine must stay at 100%)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tracker
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tracker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Schema matches migrations
        run: pnpm db:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations are a no-op the second time
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed -- --demo

      - name: Database integration tests (schema, API, worker)
        run: pnpm exec vitest run --project @tracker/db --project @tracker/api --project @tracker/worker

  # Builds the images once (from the PR's code, not the published ones), smoke-tests the stack,
  # then runs the end-to-end tests against it.
  docker:
    name: docker + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The worker ticks every 2s instead of every minute (deploy/docker-compose.e2e.yml).
      COMPOSE_FILE: compose.yaml:deploy/docker-compose.build.yml:deploy/docker-compose.e2e.yml
      E2E_BASE_URL: http://localhost:8080
      # Image labels (deploy/docker-compose.build.yml); the version is added by a step below.
      TRACKER_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No pre-release suffix: every published version also becomes `latest`.
      - name: Read the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::\"version\" must be MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          echo "TRACKER_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      # A fresh database every run: the first-run spec needs no household to exist yet, and the
      # smoke test below creates none.
      - name: Build and start the stack
        id: stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'Intelligent Tracker'
          curl -fsS http://localhost:8080/some/spa/route | grep -q 'Intelligent Tracker'
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Check the api migrated and seeded the database
        run: |
          psql() { docker compose exec -T db psql -U tracker -d tracker -tAc "$1"; }
          migrations=$(psql 'select count(*) from drizzle.__drizzle_migrations')
          holidays=$(psql 'select count(*) from bank_holiday')
          echo "migrations=$migrations bank_holidays=$holidays"
          test "$migrations" -gt 0
          test "$holidays" -gt 0

      # The e2e steps run whenever the stack is up, even if a smoke check above failed.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: pnpm --filter @tracker/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      # On main, hand the tested images to the publish workflow (publish-images.yml) so it pushes
      # exactly what passed here instead of rebuilding.
      - name: Save images for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p images
          docker save intelligent-tracker-backend -o images/backend.tar
          docker save intelligent-tracker-web -o images/web.tar

      - name: Upload images for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images
          if-no-files-found: error
          retention-days: 1

      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
